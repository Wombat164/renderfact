# PUBLIC ci.yml (staged; the sweep promotes this to .github/workflows/ci.yml,
# replacing the private-phase workflow which depends on the non-shipping
# private gate). Same test matrix; hygiene = the self-contained generic gate.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.14"
          - os: windows-latest
            python: "3.11"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e .[dev]
      - run: pytest -q

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
      # 6083c123eb55 carries a non-allowlisted author identity. It is unreachable from any branch
      # (its PR was closed and its branch deleted) but GitHub keeps refs/pull/<n>/head forever, so
      # this scan, which reads --all on purpose, would otherwise fail on every future PR over a
      # commit nobody can reach. Baselined by SHA, not by email: an --allow-email entry would write
      # the very string this gate exists to exclude into a tracked file in a public repo, and would
      # additionally wave through any future commit carrying it. A SHA accepts exactly one
      # immutable object and pre-authorises nothing.
      - run: python scripts/generic_gate.py --baseline-sha 6083c123eb55
      - name: Wiki reference in sync with the render command surface
        run: python scripts/check_wiki_sync.py
